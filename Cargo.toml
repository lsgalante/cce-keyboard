[package]
name = "cce-keyboard"
version = "0.1.0"
edition = "2021"

[dependencies]
cce-ui = { git = "https://github.com/lsgalante/cce-ui.git", rev = "b00b57412b207dd10b2adbf572ded1d144c773d3" }
calloop = "0.13.0"
wayland-client = { version = "0.31", features = ["system"] }
# zwp_virtual_keyboard_v1: how the keys reach the focused window.
wayland-protocols-misc = { version = "0.3", features = ["client"] }
# The keymap uploaded with the virtual keyboard, and the labels read from it.
xkbcommon = "0.7"
rustix = { version = "1", features = ["fs", "time"] }
kdl = "4.6"
serde_json = "1"
log = "0.4"
env_logger = "0.11"
